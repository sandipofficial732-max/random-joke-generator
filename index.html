<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="joke-wrapper">
            <div class="header">
                <h1>😂 Joke Generator</h1>
                <p>Get a random laugh instantly!</p>
            </div>

            <div class="joke-display">
                <div id="jokeContent" class="joke-content">
                    <p class="loading-text">Click the button to get a joke!</p>
                </div>
                <div id="jokeType" class="joke-type"></div>
            </div>

            <div class="button-group">
                <button id="getJokeBtn" class="btn btn-primary">Get New Joke</button>
                <button id="shareBtn" class="btn btn-secondary">Share Joke</button>
                <button id="favoriteBtn" class="btn btn-secondary">❤️ Favorite</button>
            </div>

            <div class="filter-section">
                <label for="jokeCategory">Category:</label>
                <select id="jokeCategory">
                    <option value="general">General</option>
                    <option value="programming">Programming</option>
                    <option value="knock-knock">Knock Knock</option>
                </select>
            </div>

            <div class="favorites-section">
                <h2>❤️ Favorite Jokes</h2>
                <ul id="favoritesList" class="favorites-list"></ul>
                <button id="clearFavBtn" class="btn btn-danger">Clear All Favorites</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
